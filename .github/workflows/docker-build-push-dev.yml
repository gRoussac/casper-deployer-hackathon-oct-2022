name: CI/CD Image dev

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - "docker/**"
      - "www/**"
      - "wasm/**"
      - "casper-rust-wasm-sdk/**"
      - "Makefile"
      - ".github/workflows/docker-build-push-dev.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-push-dev:
    name: Build and Push Docker Image :dev and :latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image :dev and :latest
        run: make docker-build-dev

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push :dev and :latest to Docker Hub (interchouette)
        run: make docker-push-dev-hub
        env:
          CI: "1"

      # Render does not watch Hub for new digests - call the service Deploy Hook
      # after a successful push so it pulls interchouette/casper-deployer:latest.
      - name: Trigger Render redeploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK}" ]; then
            echo "RENDER_DEPLOY_HOOK secret not set; skipping Render redeploy"
            exit 0
          fi
          echo "Triggering Render deploy hook…"
          curl -fsS -X GET "${RENDER_DEPLOY_HOOK}"
          echo
          echo "Render deploy requested"

      - name: Log in to GHCR (personal)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Push :dev and :latest to personal GHCR
        run: make docker-push-dev-ghcr-personal

      - name: Log in to GHCR (Interchouette / ITC)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME_ITC }}
          password: ${{ secrets.GHCR_PAT_ITC }}

      - name: Push :dev and :latest to ghcr.io/interchouette and interchouette-itc
        run: make docker-push-dev-ghcr-itc
