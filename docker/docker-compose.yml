version: "3"
services:
  casper-deployer:
    container_name: casper-deployer
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: casper-deployer:local
    ports:
      - "4242:4242"
    environment:
      - PORT=4242

# Build and run from repository root:
#   docker compose -f docker/docker-compose.yml up --build
# Visit http://localhost:4242/
